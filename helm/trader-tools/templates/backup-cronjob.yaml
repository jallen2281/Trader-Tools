{{- if .Values.backup.enabled }}
# Nightly encrypted pg_dump of the application database onto the shared volume.
#
# This lived in k8s/backup-cronjob.yaml and was applied by hand, which is exactly how it
# came to run an unencrypted script for weeks after the repo said otherwise: nothing
# deploys k8s/, so editing it changed a file and nothing else. It is here now so ArgoCD
# owns it and the repo cannot disagree with the cluster in silence.
#
# The script is a real file at files/backup.sh rather than a heredoc in this template. That
# keeps one copy — it was previously duplicated between the repo root and the ConfigMap,
# and the two had already drifted (bash vs sh, and a different pipefail idiom) — and the
# checksum annotation below restarts nothing but forces a visible diff in ArgoCD whenever
# the script changes, so a script edit cannot land unnoticed again.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.backup.scriptConfigMap }}
  labels:
    {{- include "trader-tools.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
data:
  backup.sh: |
{{ .Files.Get "files/backup.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.backup.name }}
  labels:
    {{- include "trader-tools.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    # Changes with the script, so a drifted ConfigMap shows up as an OutOfSync CronJob
    # rather than as nothing at all.
    checksum/script: {{ .Files.Get "files/backup.sh" | sha256sum }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # A backup that has been failing quietly is the whole nightmare, so failures are kept
  # around longer than successes.
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "trader-tools.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: pg-backup
              image: {{ .Values.backup.image | quote }}
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - name: PGHOST
                  value: {{ .Values.backup.pgHost | quote }}
                - name: PGPORT
                  value: {{ .Values.backup.pgPort | quote }}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.dbSecret }}
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.dbSecret }}
                      key: password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.dbSecret }}
                      key: database
                - name: BACKUP_DIR
                  value: {{ .Values.backup.dir | quote }}
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
                # Optional on purpose. Without it the job still runs and writes an
                # unencrypted dump, because losing the backup entirely is worse than the
                # status quo — but the filename suffix and the log both say so plainly.
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.encryptionSecret }}
                      key: BACKUP_ENCRYPTION_KEY
                      optional: true
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup-script
                  mountPath: /scripts
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ .Values.backup.claimName | default (include "trader-tools.fullname" .) }}
            - name: backup-script
              configMap:
                name: {{ .Values.backup.scriptConfigMap }}
                defaultMode: 0755
{{- end }}
