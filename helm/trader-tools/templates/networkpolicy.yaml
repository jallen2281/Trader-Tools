{{- if .Values.networkPolicy.enabled }}
# Removes implicit network trust inside the cluster.
#
# Without these, anything running anywhere in the cluster can open a connection to the
# application pods. That is the definition of implicit trust based on network position, and
# it is the single largest gap between this deployment and a zero-trust posture — the
# application layer already authenticates and authorizes every individual request, but the
# network below it trusts anyone who is already inside.
#
# SHIPPED DISABLED. A NetworkPolicy that is subtly wrong does not fail loudly; it silently
# drops traffic, and the usual symptom is the application unable to reach its own database.
# Enable deliberately, in this order:
#
#   1. Confirm which namespace the ingress controller runs in, and the addresses the
#      kubelet probes actually arrive from. Both are verified for this cluster and
#      recorded in values.yaml with the commands used; re-check after a node changes.
#   2. Set networkPolicy.enabled=true, leaving restrictEgress false. This constrains only
#      INBOUND traffic, which cannot break the app's outbound calls to Postgres, Plaid,
#      Yahoo or the AI providers.
#   3. Verify the site still loads and a page that hits the database still works.
#   4. Only then consider restrictEgress, and read the warning on that section first.
#
# A cluster whose CNI does not enforce NetworkPolicy will accept these objects and quietly
# ignore them, which looks identical to working. Verify enforcement rather than assuming it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trader-tools.fullname" . }}-default-deny-ingress
  labels:
    {{- include "trader-tools.labels" . | nindent 4 }}
spec:
  # Empty selector = every pod in this namespace.
  podSelector: {}
  policyTypes:
    - Ingress
  # No ingress rules at all: nothing may connect in except where a later policy allows it.
  # Policies are additive, so the allow rules below reopen exactly what is needed.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trader-tools.fullname" . }}-allow-ingress-controller
  labels:
    {{- include "trader-tools.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trader-tools.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
---
# Probes come from the kubelet on the node, not from a pod, so they arrive with a host
# address rather than a pod identity a namespaceSelector could match. Without this the
# liveness and readiness probes are dropped and every pod is killed as unhealthy — the most
# common way enabling NetworkPolicy takes an application down.
#
# It is a LIST, not one CIDR, because the source address is whatever Linux picks for the
# route to the pod, and that is not necessarily the node's INTERNAL-IP: on this cluster
# three nodes answer from their public address and one from a 10.0.1.1 it carries on
# loopback. Widening a single range until it covers every case is how this rule ends up
# admitting the whole pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trader-tools.fullname" . }}-allow-kubelet-probes
  labels:
    {{- include "trader-tools.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trader-tools.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.nodeCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- if .Values.networkPolicy.restrictEgress }}
---
# WARNING - read before enabling.
#
# Kubernetes NetworkPolicy is deny-by-default ONCE a policy of that type selects a pod. The
# moment any egress rule applies, every destination not listed here is blocked. This
# application legitimately talks to: its Postgres database (possibly in another namespace),
# Plaid, Yahoo Finance, Anthropic, Google OAuth and Google AI. Miss one and the failure is a
# hang or a timeout rather than a clear error.
#
# The egress allowances below are broad on purpose: DNS, plus all traffic to addresses
# outside the cluster's own pod and service ranges. That still removes lateral movement to
# other workloads in the cluster, which is the property worth having, without pretending to
# enumerate every third-party IP range — those change without notice, and a policy that
# breaks when a provider re-IPs is a policy that gets disabled in an outage and never
# re-enabled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trader-tools.fullname" . }}-egress
  labels:
    {{- include "trader-tools.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trader-tools.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS must come first in practice: without it every other rule is unreachable by name.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The database, wherever it runs.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.databaseNamespace | quote }}
      ports:
        - protocol: TCP
          port: 5432
    # Everything outside the cluster: third-party APIs. Cluster-internal ranges are excluded
    # so this does not silently re-permit lateral movement.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.clusterCidrs }}
              - {{ . | quote }}
              {{- end }}
{{- end }}
{{- end }}
