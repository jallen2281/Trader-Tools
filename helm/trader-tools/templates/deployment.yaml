apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trader-tools.fullname" . }}
  labels:
    {{- include "trader-tools.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable:0 froze the whole rollout whenever one pod couldn't pull its
      # image (a node with broken DNS to ghcr.io). Allow one unavailable + extra surge
      # so a single bad node can't wedge the deployment — healthy nodes still converge.
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "trader-tools.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        commit-sha: {{ .Values.commitSha | quote }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "trader-tools.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trader-tools.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "trader-tools.fullname" . }}
            - secretRef:
                name: {{ include "trader-tools.fullname" . }}
            # AI provider keys (ANTHROPIC_API_KEY, GOOGLE_AI_API_KEY) live in a
            # separately-managed secret so they never sit in this chart. optional
            # so the pod still starts if it's absent.
            - secretRef:
                name: {{ .Values.aiKeysSecret | default "ai-keys" }}
                optional: true
            # Plaid credentials (PLAID_CLIENT_ID, PLAID_SECRET, PLAID_ENCRYPTION_KEY) in
            # their own secret, same reasoning as the AI keys: bank credentials should not
            # share a rotation cycle or a blast radius with the app's own secret. optional
            # so the pod still starts without them — the app just refuses to open a bank
            # connection, which is the correct behaviour when the encryption key is absent.
            - secretRef:
                name: {{ .Values.plaidKeysSecret | default "plaid-keys" }}
                optional: true
            # DOC_ENCRYPTION_KEY, which encrypts uploaded tax documents at rest. Its own
            # secret for the same reason as the two above, and optional for the same reason
            # too: without it the app refuses uploads and says so, which is the correct
            # behaviour — far better than accepting W-2s and storing them in the clear.
            - secretRef:
                name: {{ .Values.docKeySecret | default "trader-tools-doc-key" }}
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # Readiness, unlike liveness, reacts to a degraded app: a pod whose auth stack
            # failed to start is pulled from the service so a rollout stalls on the healthy
            # previous pods instead of replacing them with ones that only answer 401.
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "trader-tools.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
