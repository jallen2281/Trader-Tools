# Default values for trader-tools Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/jallen2281/trader-tools  # Update with your registry
  pullPolicy: Always
  tag: "latest"

# Deploy trigger: CI bumps this to the deployed commit SHA on every push so the
# rendered manifest changes and ArgoCD rolls the pods (which then re-pull :latest).
# Without this, a code-only commit leaves the :latest manifest unchanged and pods
# never restart. Do not edit by hand — the build workflow overwrites it.
commitSha: "c9c3c5853e"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Name of a separately-managed secret holding AI provider keys
# (ANTHROPIC_API_KEY, GOOGLE_AI_API_KEY). Mounted via envFrom as optional, so an
# absent secret won't block startup. The keys are NOT stored in this chart.
aiKeysSecret: "ai-keys"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 5000
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/affinity: "cookie"
  hosts:
    - host: tradertools.kegbot.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: trader-tools-tls
      hosts:
        - tradertools.kegbot.net

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false

persistence:
  enabled: true
  storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi

# Application configuration
config:
  flaskEnv: production
  logLevel: INFO
  
  # LLM Provider: ollama or rkllm
  llmProvider: rkllm
  
  # Ollama Configuration
  ollamaBaseUrl: http://localhost:11434
  ollamaModel: llama3.2
  ollamaTimeout: "120"
  useVision: "False"
  fallbackModel: llama3.2
  
  # RKLLM Configuration (Turing Pi)
  rkllmBaseUrl: http://node1:8000
  rkllmEndpoint: /rkllm_chat
  rkllmTimeout: "120"
  
  # Chart Configuration
  chartDpi: "100"
  chartStyle: "seaborn-v0_8-darkgrid"
  chartWidth: "12"
  chartHeight: "6"
  
  # Default Stock Settings  
  defaultSymbol: SPX
  defaultPeriod: 6mo
  defaultInterval: 1d
  
  # Monitoring (increased to reduce Yahoo Finance API load)
  monitoringInterval: 900  # 15 minutes (increased from 5 min)
  alertCheckInterval: 900  # 15 minutes (increased from 5 min)
  
  # Feature Flags
  enablePatternRecognition: true
  enableMLDetection: true
  enableSentimentAnalysis: true
  
  # Rate Limiting
  rateLimitEnabled: true
  rateLimitDefault: "100 per hour"

# Secrets (should be set via --set-string or separate values file)
secrets:
  secretKey: ""  # REQUIRED
  databaseUrl: ""  # REQUIRED: postgresql://user:pass@host:5432/postgres
  googleClientId: ""  # REQUIRED
  googleClientSecret: ""  # REQUIRED
  alphaVantageApiKey: ""
  newsApiKey: ""
  quandlApiKey: ""
  # ollamaBaseUrl moved to config (not sensitive)

nodeSelector: {}

tolerations: []

affinity:
  # (Removed the node1 exclusion — node1 was rebooted and is healthy again; the
  # cluster DNS issue was fixed. maxUnavailable:1 + maxSurge:2 keeps rollouts
  # resilient to any single node that can't pull, so no per-node exclusion is needed.)
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - trader-tools
          topologyKey: kubernetes.io/hostname

# ---------------------------------------------------------------------------
# Data retention enforcement — see DATA_RETENTION_POLICY.txt.
# The policy defines these periods; the retention CronJob enforces them. Change a
# value here and change Section 3 of the policy to match, then note it in the
# policy's revision history.
# ---------------------------------------------------------------------------
retention:
  enabled: true
  # 03:30 UTC — deliberately after the 02:00 backup, so a fresh dump exists from
  # 90 minutes before anything is permanently destroyed.
  schedule: "30 3 * * *"
  accountDays: 30    # grace period before a soft-deleted account is hard-purged
  sessionDays: 7     # how long expired session rows linger before deletion
  aiCacheDays: 30    # how long expired AI cache entries linger before deletion
  dryRun: false      # "true" logs what would be purged without deleting anything
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
