# Default values for trader-tools Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/jallen2281/trader-tools  # Update with your registry
  pullPolicy: Always
  tag: "latest"

# Deploy trigger: CI bumps this to the deployed commit SHA on every push so the
# rendered manifest changes and ArgoCD rolls the pods (which then re-pull :latest).
# Without this, a code-only commit leaves the :latest manifest unchanged and pods
# never restart. Do not edit by hand — the build workflow overwrites it.
commitSha: "a34a743fd5"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Name of a separately-managed secret holding AI provider keys
# (ANTHROPIC_API_KEY, GOOGLE_AI_API_KEY). Mounted via envFrom as optional, so an
# absent secret won't block startup. The keys are NOT stored in this chart.
aiKeysSecret: "ai-keys"

# Name of a separately-managed secret holding Plaid credentials
# (PLAID_CLIENT_ID, PLAID_SECRET, PLAID_ENCRYPTION_KEY). Mounted via envFrom as optional.
# Create it out-of-band, exactly like ai-keys:
#   kubectl -n trader-tools create secret generic plaid-keys \
#     --from-literal=PLAID_CLIENT_ID='...' \
#     --from-literal=PLAID_SECRET='...' \
#     --from-literal=PLAID_ENCRYPTION_KEY="$(python -c \
#        'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
# PLAID_ENV lives in the configmap (config.plaidEnv) since it is not sensitive.
plaidKeysSecret: "plaid-keys"

# Name of a separately-managed secret holding DOC_ENCRYPTION_KEY, which encrypts uploaded
# tax documents at rest. Mounted via envFrom as optional: without it the app refuses
# uploads rather than storing W-2s in the clear, so an absent secret is safe but visible.
#   kubectl -n trader-tools create secret generic trader-tools-doc-key \
#     --from-literal=DOC_ENCRYPTION_KEY="$(python -c \
#        'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
# LOSING THIS KEY MAKES EVERY STORED DOCUMENT UNREADABLE. Keep a copy outside the cluster.
docKeySecret: "trader-tools-doc-key"

# Removes implicit network trust inside the cluster — the largest single gap between this
# deployment and a zero-trust posture. DISABLED BY DEFAULT: a wrong NetworkPolicy does not
# fail loudly, it silently drops traffic, and the usual symptom is the app unable to reach
# its own database. See the comments in templates/networkpolicy.yaml before enabling.
networkPolicy:
  enabled: false
  # VERIFIED on this cluster: MicroK8s' bundled nginx controller, a DaemonSet in the
  # "ingress" namespace, which carries kubernetes.io/metadata.name=ingress as the selector
  # below needs. It runs WITHOUT hostNetwork, so its traffic reaches the app with a pod
  # source address and a namespaceSelector matches it. Re-check with:
  #   microk8s kubectl get pods -A | grep -i ingress
  #   microk8s kubectl get ns ingress -o jsonpath='{.metadata.labels}'
  ingressNamespace: "ingress"
  # Liveness and readiness probes come from the kubelet on the node, not from a pod, so
  # they need an explicit allowance. Getting this wrong kills every pod as unhealthy.
  #
  # The INTERNAL-IP column is NOT a reliable answer. The source is whatever Linux picks
  # for the route to the pod, so ask the kernel directly, on EVERY node:
  #   microk8s kubectl get pods -n trader-tools -o wide     # a pod on that node
  #   ip route get <that pod IP>                            # read the "src" field
  # On this cluster that gives the node's public address on node1-3, and 10.0.1.1 on
  # node4, which carries it on loopback and prefers it as the source.
  #
  # Listed as individual hosts rather than a summarised block. A /29 here does not line up
  # with the addresses in use (the API server rejects 69.16.214.140/29 as ambiguous, since
  # a /29 boundary falls on .136 or .144), and rounding outward to a /27 would admit
  # thirty-two addresses to buy nothing. Adding a node means adding a line, which is the
  # right failure mode for a security control: visible, not silent.
  #
  # Do NOT widen this to 10.0.0.0/8 to cover the node4 case. That range contains the pod
  # CIDR 10.1.0.0/16, so it would admit every pod in the cluster and make the default-deny
  # above purely decorative.
  #
  # All four confirmed directly with `ip route get`, not inferred: node1 .143, node2 .144,
  # node3 .145 all answer from their own public address, and node4 answers from 10.0.1.1.
  # node2 and node3 carry only eth0 and vxlan.calico, which makes node4's extra loopback
  # address the outlier rather than the pattern. node4's .146 is kept as well, so the rule
  # still holds if that loopback address ever goes away.
  # (node2/node3 are reachable by hopping through node1: ssh ubuntu@node1, then ssh node2.)
  nodeCidrs:
    - "69.16.214.143/32"    # node1, verified
    - "69.16.214.144/32"    # node2, verified
    - "69.16.214.145/32"    # node3, verified
    - "69.16.214.146/32"    # node4, belt-and-braces (see 10.0.1.1 below)
    - "10.0.1.1/32"         # node4 again: it prefers this loopback address as the source
  # Only used when restrictEgress is true.
  restrictEgress: false
  # VERIFIED: the supabase namespace exists and holds the Postgres this app connects to.
  databaseNamespace: "supabase"
  # Pod and service ranges, excluded from the "allow everything external" egress rule so it
  # does not quietly re-permit lateral movement inside the cluster.
  # VERIFIED from the apiserver args on this cluster:
  #   --cluster-cidr=10.1.0.0/16              (pods)
  #   --service-cluster-ip-range=10.152.183.0/24
  # These were k3s defaults before and matched nothing here, which would have left the
  # "everything external" egress rule quietly permitting the whole cluster.
  clusterCidrs:
    - "10.1.0.0/16"
    - "10.152.183.0/24"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 5000
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

# THIS FILE is the source of truth for the ingress, not the Portainer UI.
#
# The live Ingress carries Portainer's io.portainer.kubernetes.ingress.owner label, so it
# shows up as editable there — but it is rendered from this chart and tracked by ArgoCD,
# whose sync policy has selfHeal and prune both on. An annotation changed in Portainer is
# reverted on the next sync, with no error anywhere: the UI accepts the edit, and it
# silently goes away minutes later. Change it here, commit, and let ArgoCD apply it.
#
# (Extra labels Portainer adds are tolerated — ArgoCD only reconciles the fields the chart
# declares — which is why the app still reports Synced with that label present.)
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/affinity: "cookie"
  hosts:
    - host: tradertools.kegbot.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: trader-tools-tls
      hosts:
        - tradertools.kegbot.net

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false

persistence:
  enabled: true
  storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi

# Application configuration
config:
  flaskEnv: production
  logLevel: INFO

  # Plaid: 'sandbox' or 'production'. plaidProducts is a comma-separated list — put
  # anything you might enable later in Plaid's additional_consented_products instead,
  # because adding a product here after the fact forces every connected user back
  # through Link to re-authorize.
  # This has to match the keys in the plaid-keys secret. They are not interchangeable:
  # production credentials sent to sandbox.plaid.com come back INVALID_API_KEYS, which reads
  # like a bad secret rather than a wrong endpoint. Rotating the secret alone is not enough
  # — change this in the same breath, and let ArgoCD roll the pods (a Secret or ConfigMap
  # edit does not restart anything by itself; the commit-sha annotation is what does).
  plaidEnv: production
  plaidProducts: "transactions"
  
  # LLM Provider: ollama or rkllm
  llmProvider: rkllm
  
  # Ollama Configuration
  ollamaBaseUrl: http://localhost:11434
  ollamaModel: llama3.2
  ollamaTimeout: "120"
  useVision: "False"
  fallbackModel: llama3.2
  
  # RKLLM Configuration (Turing Pi)
  rkllmBaseUrl: http://node1:8000
  rkllmEndpoint: /rkllm_chat
  rkllmTimeout: "120"
  
  # Chart Configuration
  chartDpi: "100"
  chartStyle: "seaborn-v0_8-darkgrid"
  chartWidth: "12"
  chartHeight: "6"
  
  # Default Stock Settings  
  defaultSymbol: SPX
  defaultPeriod: 6mo
  defaultInterval: 1d
  
  # Monitoring (increased to reduce Yahoo Finance API load)
  monitoringInterval: 900  # 15 minutes (increased from 5 min)
  alertCheckInterval: 900  # 15 minutes (increased from 5 min)
  
  # Feature Flags
  enablePatternRecognition: true
  enableMLDetection: true
  enableSentimentAnalysis: true
  
  # Rate Limiting
  rateLimitEnabled: true
  rateLimitDefault: "100 per hour"

# Secrets (should be set via --set-string or separate values file)
secrets:
  secretKey: ""  # REQUIRED
  databaseUrl: ""  # REQUIRED: postgresql://user:pass@host:5432/postgres
  googleClientId: ""  # REQUIRED
  googleClientSecret: ""  # REQUIRED
  alphaVantageApiKey: ""
  newsApiKey: ""
  quandlApiKey: ""
  # Plaid. plaidEncryptionKey is a Fernet key that encrypts stored access tokens at rest;
  # without it the app refuses to start a bank connection at all. Generate one with:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # Rotating it makes every stored token undecryptable — users would have to reconnect.
  # Encrypts stored tax documents at rest. Uploads are REFUSED without it, because these
  # files contain Social Security numbers and the Ceph storage beneath them is not
  # encrypted. Losing this key makes stored documents unrecoverable — back it up.
  docEncryptionKey: ""
  plaidClientId: ""
  plaidSecret: ""
  plaidEncryptionKey: ""
  # ollamaBaseUrl moved to config (not sensitive)

nodeSelector: {}

tolerations: []

affinity:
  # (Removed the node1 exclusion — node1 was rebooted and is healthy again; the
  # cluster DNS issue was fixed. maxUnavailable:1 + maxSurge:2 keeps rollouts
  # resilient to any single node that can't pull, so no per-node exclusion is needed.)
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - trader-tools
          topologyKey: kubernetes.io/hostname

# ---------------------------------------------------------------------------
# Data retention enforcement — see DATA_RETENTION_POLICY.txt.
# The policy defines these periods; the retention CronJob enforces them. Change a
# value here and change Section 3 of the policy to match, then note it in the
# policy's revision history.
# ---------------------------------------------------------------------------
# Nightly encrypted pg_dump onto the shared volume. The script itself is a real file at
# files/backup.sh — one copy, read by the template — not a heredoc, and not a second copy
# kept "in step" with another by hand.
#
# Names below match the objects that already exist on the cluster, so ArgoCD adopts them
# rather than creating duplicates. Do not rename them casually: a rename leaves the old
# CronJob running, untracked, alongside the new one.
backup:
  enabled: true
  name: "tradertools-db-backup"
  scriptConfigMap: "tradertools-backup-script"
  # 02:00 UTC, and the retention job below runs at 03:30 so a fresh dump always exists
  # before anything is permanently destroyed.
  schedule: "0 2 * * *"
  image: "postgres:15-alpine"
  # Supabase runs in its own namespace, hence the fully-qualified service name.
  pgHost: "supabase-supabase-db.supabase.svc.cluster.local"
  pgPort: 5432
  dbSecret: "tradertools-db-secret"          # keys: username, password, database
  # Holds BACKUP_ENCRYPTION_KEY. Mounted optional: without it the job still takes a backup
  # and says loudly that it is unencrypted, rather than failing and leaving none at all.
  # LOSING THIS KEY MAKES EVERY ENCRYPTED DUMP UNRECOVERABLE — keep a copy outside the
  # cluster it protects.
  encryptionSecret: "tradertools-backup-encryption"
  dir: "/data/backups"
  retentionDays: 30
  claimName: "trader-tools-data"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

retention:
  enabled: true
  # 03:30 UTC — deliberately after the 02:00 backup, so a fresh dump exists from
  # 90 minutes before anything is permanently destroyed.
  schedule: "30 3 * * *"
  accountDays: 30    # grace period before a soft-deleted account is hard-purged
  sessionDays: 7     # how long expired session rows linger before deletion
  aiCacheDays: 30    # how long expired AI cache entries linger before deletion
  dryRun: false      # "true" logs what would be purged without deleting anything
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
